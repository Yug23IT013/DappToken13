<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DappToken13 ICO Sale</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
</head>
<body>
    <div class="container" style="width: 650px;">
        <div class="row">
            <div class="col-lg-12">
                <h1 class="text-center">DappToken13 ICO Sale</h1>
                <hr/>
                <br/>
            </div>
            <div class="loader">
                <p class="text-center">Loading...</p>
            </div>
            <div class="text-center" id="content">
                <p>
                    Introduction DappToken13
                    Token price is <span id="token-price"> </span> Ether. You currently have <span id="user-tokens"> </span>&nbsp;DappToken13
                </p>
                <br/>
                <form role="form">
                    <div class="form-group">
                        <div class="input-group">
                            <input class="form-control input-lg" type="number" id="numberOfTokens" name="number" value="1" min="1" pattern="[0-9]"></input>
                            <span class="input-group-btn">
                                <button type="submit" class="btn btn-primary btn-lg" id="buy-tokens">Buy Tokens</button>
                        </div>
                    </div>
                </form>
                <br/>
                <div class="progress">
                    <div id="progress" class="progress-bar progress-bar-striped active" aria-valuemin="0" aria-valuemax="100"></div>
                </div>
                <p><span class="token-sold"></span> / <span class="tokens-available"> token sold</span></p>
                <hr>
                <p id="accountAddress"></p>
            </div>
        </div>
    </div>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.12.4/jquery.min.js"></script>
    <script src="js/web3.min.js"></script>
    <script src="js/truffle-contract.min.js"></script>
    <script src="js/bootstrap.min.js"></script>
    <script src="js/app.js"></script>>
</body>
</html>
